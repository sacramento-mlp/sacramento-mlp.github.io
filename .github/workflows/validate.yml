name: Validate portfolio
on:
  push:
    branches: ['develop/v1.0']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: Require clean dependency audit
        run: npm audit --audit-level=low
      - name: Regression tests
        run: npm test
      - name: Astro and TypeScript checks
        run: npm run check
      - name: Theme contrast
        run: npm run verify:contrast
      - name: Build
        run: npm run build
      - name: Verify distribution
        run: npm run verify:dist
      - name: Retain generated lockfile and build
        uses: actions/upload-artifact@v6
        with:
          name: validation-output
          path: |
            package-lock.json
            dist/
          retention-days: 3
