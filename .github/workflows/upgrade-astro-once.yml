name: One-time validated Astro migration
on:
  push:
    branches: ['develop/v1.1-seo']
    paths: ['.github/workflows/upgrade-astro-once.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/develop/v1.1-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
      - name: Resolve approved Astro version
        run: |
          set -euo pipefail
          node --version
          npm view astro@7.4.13 engines --json
          npm install --package-lock-only --ignore-scripts --save-exact astro@7.4.13
          npm ci
          npm ls astro @astrojs/check typescript sharp zod esbuild
      - name: Require clean audit
        run: npm audit --audit-level=low
      - run: npm test
      - run: npm run check
      - run: npm run verify:contrast
      - run: npm run build
      - run: npm run verify:dist
      - name: Retain verified manifests
        uses: actions/upload-artifact@v6
        with:
          name: verified-astro-migration
          path: |
            package.json
            package-lock.json
          retention-days: 3
  integrate:
    needs: verify
    if: github.ref == 'refs/heads/develop/v1.1-seo'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: verified-astro-migration
          path: verified-manifests
      - name: Commit only validated manifests
        run: |
          set -euo pipefail
          cp verified-manifests/package.json verified-manifests/package-lock.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "build: migrate to verified Astro 7.4.13"
          git push origin HEAD:refs/heads/develop/v1.1-seo
